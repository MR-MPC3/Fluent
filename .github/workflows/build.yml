name: Build Fluent

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Install Aftman
        run: |
          curl -fsSL https://github.com/LPGhatguy/aftman/releases/latest/download/aftman-x86_64-unknown-linux-gnu.tar.gz -o aftman.tar.gz
          tar -xzf aftman.tar.gz
          chmod +x aftman
          sudo mv aftman /usr/local/bin/aftman
          aftman --version

      - name: Install Rojo and Lune
        run: |
          aftman install
          echo "$HOME/.aftman/bin" >> "$GITHUB_PATH"

      - name: Check tools
        run: |
          rojo --version
          lune --version

      - name: Build Fluent
        run: pnpm run bundle

      - name: Find generated files
        run: |
          echo "===== GENERATED FILES ====="
          find . -type f \( -name "*.lua" -o -name "*.luau" -o -name "*.rbxm" \) | sort

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fluent-build
          path: |
            dist/**
            main.lua
          if-no-files-found: warn
